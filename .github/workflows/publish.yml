name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm test
      - name: Prepare next patch and README
        id: release
        run: node scripts/release.mjs
      - name: Build and pack
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/npm-pack.json"
          echo "file=$(jq -r '.[0].filename' "$RUNNER_TEMP/npm-pack.json")" >> "$GITHUB_OUTPUT"
      - name: Publish public scoped package
        run: npm publish "$PACKAGE_FILE" --access public
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
          # Empty when using npm Trusted Publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Update version and README on main
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Apply only release metadata to the latest main; preserve concurrent code pushes.
          git reset --hard HEAD
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B release-metadata origin/main
            node scripts/release.mjs --set "$RELEASE_VERSION"
            git add package.json package-lock.json README.md README.en.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'npm publish succeeded, but writing release metadata to main failed.' >&2
          exit 1
