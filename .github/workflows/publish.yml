name: Publish npm package

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.mdx"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure and verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_AUTH_MODE: ${{ vars.NPM_AUTH_MODE || 'token' }}
        run: |
          # Keep credentials out of the repository and logs.
          npmrc="$RUNNER_TEMP/publish.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$npmrc"
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"
          export NPM_CONFIG_USERCONFIG="$npmrc"
          if [ "$NPM_AUTH_MODE" = 'token' ]; then
            if [ -z "$NODE_AUTH_TOKEN" ]; then
              echo '::error::NPM_TOKEN is empty or unavailable. Add a Repository secret named NPM_TOKEN in this repository, then start a new run. Environment secrets require a matching job environment; organization secrets require repository access.'
              exit 1
            fi
            printf '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' >> "$npmrc"
            npm whoami --registry=https://registry.npmjs.org/ > /dev/null
            echo 'npm token authentication verified.'
          elif [ "$NPM_AUTH_MODE" = 'oidc' ]; then
            echo 'Using npm Trusted Publishing; no token auth entry was written.'
          else
            echo '::error::NPM_AUTH_MODE must be token or oidc.'
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: |
          npm run typecheck
          npm test
      - name: Prepare next patch and README
        id: release
        run: node scripts/release.mjs
      - name: Commit release snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md README.en.md
          git commit -m "chore: prepare npm release snapshot [skip ci]"
      - name: Build and pack
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/npm-pack.json"
          echo "file=$(jq -r '.[0].filename' "$RUNNER_TEMP/npm-pack.json")" >> "$GITHUB_OUTPUT"
      - name: Publish public scoped package
        run: npm publish "$PACKAGE_FILE" --access public
        env:
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
          # Used only when the npmrc contains token authentication.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public npm availability
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/verify-publication.mjs "$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).name')" "$RELEASE_VERSION"
      - name: Create GitHub Release and upload npm archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: |
          tag="v${RELEASE_VERSION}"
          # Use the previous published stable release, not an arbitrary Git tag.
          previous_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          notes_file="$RUNNER_TEMP/release-notes.md"
          notes_args=()
          if [ -n "$previous_tag" ]; then
            git fetch origin "refs/tags/$previous_tag:refs/tags/$previous_tag"
            range="$previous_tag..HEAD"
            notes_args=(--notes-start-tag "$previous_tag")
            printf '## Code changes\n\nRange: `%s` → `%s`\n\n' "$previous_tag" "$tag" > "$notes_file"
            printf '[Full comparison](https://github.com/%s/compare/%s...%s)\n\n' "$GITHUB_REPOSITORY" "$previous_tag" "$tag" >> "$notes_file"
          else
            # The first release documents all commits in its snapshot.
            range=HEAD
            printf '## Code changes\n\nInitial release: `%s`\n\n' "$tag" > "$notes_file"
          fi
          git log --reverse --format='- %s (%h)' "$range" >> "$notes_file"
          if [ -n "$previous_tag" ]; then
            printf '\n### Changed files\n\n```text\n' >> "$notes_file"
            git diff --stat "$previous_tag" HEAD >> "$notes_file"
            printf '```\n' >> "$notes_file"
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          gh release create "$tag" "$PACKAGE_FILE" --verify-tag --title "$tag" --generate-notes "${notes_args[@]}" --notes-file "$notes_file"
      - name: Update version and README on main
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Apply only release metadata to the latest main; preserve concurrent code pushes.
          git reset --hard HEAD
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B release-metadata origin/main
            node scripts/release.mjs --set "$RELEASE_VERSION"
            git add package.json package-lock.json README.md README.en.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(release): v${RELEASE_VERSION} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo 'npm publish succeeded, but writing release metadata to main failed.' >&2
          exit 1
